openapi: 3.0.0
info:
  title: Digitial Media Store (DMS) API
  description: This OpenAPI yaml describes the REST API for the Digital Media Store database.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: The localhost API server for the Digital Media Store.
  - url: http://staging-api.dms.com
    description: The staging environment for the DMS REST API.

paths:
  /employee/{id}:
    get:
      summary: Returns an employee record.
      parameters:
        - name: id
          in: path
          description: Employee ID
          required: true
          schema:
            type: integer
      responses:
        "200": # status code
          description: Get a JSON object of employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400": # status code
          description: Bad Request. Malformed id or payload.
        "404": # status code
          description: Unable to locate object with provided id.
  /employee:
    post:
      summary: Returns a newly created employee record.
      requestBody:
        description: Create an employee
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/Employee"
      responses:
        "201": # status code
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400": # status code
          description: Bad Request. Malformed id or payload.
    put:
      summary: Returns an updated employee record.
      requestBody:
        description: Update employee
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Employee"
      responses:
