components:
  schemas:
    Album:
      description: An Album Object
      type: object
      properties:
        id:
          type: integer
        Title:
          type: string
        ArtistId:
          type: integer
    Artist:
      description: An artist/musician Object
      type: object
      properties:
        id:
          type: integer
        Name:
          type: string
    Customer:
      description: A customer Object
      type: object
      properties:
        id:
          type: integer
        LastName:
          type: string
        FirstName:
          type: string
        Company:
          type: string
        Address:
          type: string
        City:
          type: string
        State:
          type: string
        Country:
          type: string
        ZipCode:
          type: string
          pattern: 'd{5}'
        Phone:
          type: string
          pattern: '[+]?d{1}? (d{3}) d{3}-d{4}'
        Email:
          type: string
        SupportRepId:
          type: integer
    Employee:
      description: An employee Object
      type: object
      properties:
        LastName:
          type: string
        FirstName:
          type: string
        Title:
          type: string
        ReportsTo:
          type: integer
        BirthDate:
          type: string
          format: date
        HireDate:
          type: string
          format: date
        Company:
          type: string
        Address:
          type: string
        City:
          type: string
        State:
          type: string
        Country:
          type: string
        ZipCode:
          type: string
          pattern: 'd{5}'
        Phone:
          type: string
          pattern: '[+]?d{1}? (d{3}) d{3}-d{4}'
        Email:
          type: string
    Genre:
      description: A genre classification Object
      type: object
      properties:
        id:
          type: integer
        Name:
          type: string
    Invoice:
      description: An invoice Object
      type: object
      properties:
        id:
          type: integer
        CustomerId:
          type: integer
        InvoiceDate:
          type: string
          format: date-time
        BillingAddress:
          type: string
        BillingCity:
          type: string
        BillingState:
          type: string
        BillingCountry:
          type: string
        BillingZipCode:
          type: string
          pattern: 'd{5}'
        Total:
          type: number
          format: float
        invoicelines:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/InvoiceLine"
    InvoiceLine:
      description: An invoice line Object
      type: object
      properties:
        id:
          type: integer
        InvoiceId:
          type: integer
        TrackId:
          type: integer
        UnitPrice:
          type: number
          format: float
        Quantity:
          type: integer
    MediaType:
      description: An type of media Object
      type: object
      properties:
        id:
          type: integer
        Name:
          type: string
    Playlist:
      description: An Playlist Object
      type: object
      properties:
        id:
          type: integer
        Name:
          type: string
        tracks:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/PlaylistTrack"
    PlaylistTrack:
      description: An Playlist Array
      type: object
      properties:
        id:
          type: integer
        PlaylistId:
          type: integer
        TrackId:
          type: integer
    Track:
      description: A Song Track Object
      type: object
      properties:
        id:
          type: integer
        Name:
          type: string
        AlbumId:
          type: integer
        MediaTypeId:
          type: integer
        GenreId:
          type: integer
        Composer:
          type: string
        Milliseconds:
          type: integer
        Bytes:
          type: integer
        UnitPrice:
          type: number
          format: float
